<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcards</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Georgia', serif;
    background: #0e0e0e;
    color: #f0f0f0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2rem;
  }
  #progress {
    font-size: 13px;
    color: #555;
    letter-spacing: 0.05em;
  }
  #card {
    width: 480px;
    min-height: 260px;
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2.5rem;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s;
    position: relative;
  }
  #card:hover { border-color: #3a3a3a; }
  #word {
    font-size: 2.8rem;
    font-weight: normal;
    letter-spacing: -0.01em;
    margin-bottom: 0.4rem;
  }
  #pos {
    font-size: 0.85rem;
    color: #555;
    font-style: italic;
    margin-bottom: 1.5rem;
  }
  #back { width: 100%; }
  #definition {
    font-size: 1.05rem;
    color: #ccc;
    line-height: 1.6;
    margin-bottom: 1rem;
    border-top: 1px solid #2a2a2a;
    padding-top: 1rem;
  }
  #example {
    font-size: 0.88rem;
    color: #555;
    font-style: italic;
    line-height: 1.5;
  }
  #hint {
    font-size: 12px;
    color: #333;
    margin-top: 1.5rem;
  }
  #buttons {
    display: flex;
    gap: 1.5rem;
  }
  button {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: 1px solid;
    background: transparent;
    font-size: 1.6rem;
    cursor: pointer;
    transition: transform 0.1s, background 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  button:active { transform: scale(0.93); }
  #btn-wrong { border-color: #5a1a1a; color: #e05555; }
  #btn-wrong:hover { background: #1f0e0e; }
  #btn-right { border-color: #1a4a2a; color: #4caf70; }
  #btn-right:hover { background: #0e1f14; }
  #next-info {
    font-size: 12px;
    color: #333;
    min-height: 16px;
  }
  #queue-info {
    font-size: 12px;
    color: #333;
  }
  .toast {
    position: fixed;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%);
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    color: #888;
    font-size: 12px;
    padding: 0.5rem 1.2rem;
    border-radius: 20px;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div id="progress">—</div>

<div id="card" onclick="revealCard()">
  <div id="word"></div>
  <div id="pos"></div>
  <div id="back" style="display:none">
    <div id="definition"></div>
    <div id="example"></div>
  </div>
  <div id="hint">tap to reveal</div>
</div>

<div id="buttons" style="visibility:hidden">
  <button id="btn-wrong" onclick="answer(false)" title="Still learning">✗</button>
  <button id="btn-right" onclick="answer(true)" title="Got it">✓</button>
</div>

<div id="next-info"></div>
<div id="queue-info"></div>
<div class="toast" id="toast"></div>

d sometimes seem aloof, but really he was just thinking about quantum mechanics."},{word:"altercation",partOfSpeech:"n.",definition:"a dispute, fight",example:"Jason and Lionel blamed one another for the car accident, leading to an altercation."},{word:"amalgamate",partOfSpeech:"v.",definition:"to bring together, unite",example:"Because of his great charisma, the presidential candidate was able to amalgamate all democrats and republicans under his banner."},{word:"ambiguous",partOfSpeech:"adj.",definition:"uncertain, variably interpretable",example:"Some people think Caesar married Cleopatra for her power, others believe he was charmed by her beauty. His actual reasons are ambiguous."},{word:"ambivalent",partOfSpeech:"adj.",definition:"having opposing feelings",example:"My feelings about Calvin are ambivalent because on one hand he is a loyal friend, but on the other, he is a cruel and vicious thief."},{word:"ameliorate",partOfSpeech:"v.",definition:"to improve",example:"The tense situation was ameliorated when Sam proposed a solution everyone could agree upon."},{word:"amenable",partOfSpeech:"adj.",definition:"willing, compliant",example:"Our father was amenable when we asked him to drive us to the farm so we could go apple picking."},{word:"amenity",partOfSpeech:"n.",definition:"an item that increases comfort",example:"Bill Gates's house is stocked with so many amenities, he never has to do anything for himself."},{word:"amiable",partOfSpeech:"adj.",definition:"friendly",example:"An amiable fellow, Harry got along with just about everyone."},{word:"amicable",partOfSpeech:"adj.",definition:"friendly",example:"Claudia and Jimmy got divorced, but amicably and without hard feelings."},{word:"amorous",partOfSpeech:"adj.",definition:"showing love, particularly sexual",example:"Whenever Albert saw Mariah wear her slinky red dress, he began to feel quite amorous."},{word:"amorphous",partOfSpeech:"adj.",definition:"without definite shape or type",example:"The effort was doomed from the start, because the reasons behind it were so amorphous and hard to pin down."},{word:"anachronistic",partOfSpeech:"adj.",definition:"being out of correct chronological order",example:"In this book you say that the Pyramids were built after the Titanic sank, which is anachronistic."},{word:"analgesic",partOfSpeech:"n.",definition:"something that reduces pain",example:"Put this analgesic on the wound so that the poor man at least feels a little better."},{word:"analogous",partOfSpeech:"adj.",definition:"similar to, so that an analogy can be drawn",example:"Though they are unrelated genetically, the bone structure of whales and fish is quite analogous."},{word:"anarchist",partOfSpeech:"n.",definition:"one who wants to eliminate all government",example:"An anarchist, Carmine wanted to dissolve every government everywhere."},{word:"anathema",partOfSpeech:"n.",definition:"a cursed, detested person",example:"I never want to see that murderer. He is an anathema to me."},{word:"anecdote",partOfSpeech:"n.",definition:"a short, humorous account",example:"After dinner, Marlon told an anecdote about the time he got his nose stuck in a toaster."},{word:"anguish",partOfSpeech:"n.",definition:"extreme sadness, torment",example:"Angelos suffered terrible anguish when he learned that Buffy had died."},{word:"animated",partOfSpeech:"adj.",definition:"lively",example:"When he begins to talk about drama, which is his true passion, he becomes very animated."},{word:"annul",partOfSpeech:"v.",definition:"to make void or invalid",example:"After seeing its unforeseen and catastrophic effects, Congress sought to annul the law."},{word:"anomaly",partOfSpeech:"n.",definition:"something that does not fit into the normal order",example:"'That rip in the space-time continuum is certainly a spatial anomaly,' said Spock to Captain Kirk."},{word:"anonymous",partOfSpeech:"adj.",definition:"being unknown, unrecognized",example:"Mary received a love poem from an anonymous admirer."},{word: elp Achilles one day, and then harm him the next."},{word:"fidelity",partOfSpeech:"n.",definition:"loyalty, devotion",example:"Guard dogs are known for the great fidelity they show toward their masters."},{word:"flagrant",partOfSpeech:"adj.",definition:"offensive, egregious",example:"The judge's decision to set the man free simply because that man was his brother was a flagrant abuse of power."},{word:"florid",partOfSpeech:"adj.",definition:"flowery, ornate",example:"The writer's florid prose belongs on a sentimental Hallmark card."},{word:"flout",partOfSpeech:"v.",definition:"to disregard or disobey openly",example:"I flouted the school's dress code by wearing a tie-dyed tank top and a pair of cut-off jeans."},{word:"forbearance",partOfSpeech:"n.",definition:"patience, restraint, toleration",example:"The doctor showed great forbearance in calming down the angry patient who shouted insults at him."},{word:"forestall",partOfSpeech:"v.",definition:"to prevent, thwart, delay",example:"I forestalled the cold I was getting by taking plenty of vitamin C pills and wearing a scarf."},{word:"forlorn",partOfSpeech:"adj.",definition:"lonely, abandoned, hopeless",example:"Even though I had the flu, my family decided to go skiing and leave me home alone, feeling feverish and forlorn."},{word:"forsake",partOfSpeech:"v.",definition:"to give up, renounce",example:"My New Year's resolution is to forsake smoking and drinking."},{word:"fortitude",partOfSpeech:"n.",definition:"strength, guts",example:"Achilles' fortitude in battle is legendary."},{word:"fortuitous",partOfSpeech:"adj.",definition:"happening by chance, often lucky or fortunate",example:"After looking for Manuel and not finding him at home, Harriet had a fortuitous encounter with him at the post office."},{word:"fractious",partOfSpeech:"adj.",definition:"troublesome or irritable",example:"Although the child insisted he wasn't tired, his fractious behavior convinced everyone it was time to put him to bed."},{word:"fraught" capable of being taken back",example:"The Bill of Rights is an irrevocable part of American law."},{word:"jubilant",partOfSpeech:"adj.",definition:"extremely joyful, happy",example:"The crowd was jubilant when the firefighter carried the woman from the flaming building."},{word:"judicious",partOfSpeech:"adj.",definition:"having or exercising sound judgment",example:"When the judicious king decided to compromise rather than send his army to its certain death, he was applauded."},{word:"laconic",partOfSpeech:"adj.",definition:"terse in speech or writing",example:"The author's laconic style has won him many followers who dislike wordiness."},{word:"languid",partOfSpeech:"adj.",definition:"sluggish from fatigue or weakness",example:"In the summer months, the great heat makes people languid and lazy."},{word:"latent",partOfSpeech:"adj.",definition:"hidden, but capable of being exposed",example:"Sigmund's dream represented his latent paranoid obsession with other people's shoes."},{word:"laudatory",partOfSpeech:"adj.",definition:"expressing admiration or praise",example:"Such laudatory comments are unusual from someone who is usually so reserved in his opinions."},{word:"legerdemain",partOfSpeech:"n.",definition:"deception, slight-of-hand",example:"Smuggling the French plants through customs by claiming that they were fake was a remarkable bit of legerdemain."},{word:"lenient",partOfSpeech:"adj.",definition:"demonstrating tolerance or gentleness",example:"Because Professor Oglethorpe allowed his students to choose their final grades, the other teachers believed that he was excessively lenient."},{word:"lethargic",partOfSpeech:"adj.",definition:"in a state of sluggishness or apathy",example:"When Jean Claude explained to his boss that he was lethargic and didn't feel like working that day, the boss fired him."},{word:"licentious",partOfSpeech:"adj.",definition:"displaying a lack of moral or legal restraints",example:"Marilee has always been fascinated by the licentious private lives of politicians."},{word:"limpid",partOfSpeech:"adj.",definition:"clear, transparent",example:"Mr. Johnson's limpid writing style greatly pleased readers who disliked complicated novels."},{word:"linchpin",partOfSpeech:"n.",definition:"something that holds separate parts together",example:"The linchpin in the prosecution's case was the hair from the defendant's head, which was found at the scene of the crime."},{word:"lithe",partOfSpeech:"adj.",definition:"graceful, flexible, supple",example:"Although the dancers were all outstanding, Jae Sun's control of her lithe body was particularly impressive."},{word:"lucid",partOfSpeech:"adj.",definition:"clear, easily understandable",example:"Because Guenevere's essay was so lucid, I only had to read it once to understand her reasoning."},{word:"lurid",partOfSpeech:"adj.",definition:"ghastly, sensational",example:"Gideon's story was judged too lurid to be printed in the school's literary magazine."},{word:"maelstrom",partOfSpeech:"n.",definition:"a destructive whirlpool which rapidly sucks in objects",example:"Little did the explorers know that as they turned the next bend of the calm river a vicious maelstrom would catch their boat."},{word:"magnanimous",partOfSpeech:"adj.",definition:"noble, generous",example:"Although I had already broken most of her dishes, Jacqueline was magnanimous enough to continue letting me use them."},{word:"malediction",partOfSpeech:"n.",definition:"a curse",example:"When I was arrested for speeding, I screamed maledictions against the policeman and the entire police department."},{word:"malevolent",partOfSpeech:"adj.",definition:"wanting harm to befall others",example:"The malevolent old man sat in the park all day, tripping unsuspecting passersby with his cane."},{word:"malleable",partOfSpeech:"adj.",definition:"capable of being shaped or transformed",example:"Maximillian's political opinions were so malleable that anyone he talked to was able to change his mind instantly."},{word:"mandate",partOfSpeech:"n.",definition:"an authoritative command",example:"In the Old Testament, God mandates that no one should steal."},{word:"maudlin",partOfSpeech:"adj.",definition:"weakly sentimental",example:"Although many people enjoy romantic comedies, I usually find them maudlin and shallow."},{word:"maverick",partOfSpeech:"n.",definition:"an independent, nonconformist person",example:"Andreas is a real maverick and always does things his own way."},{word:"mawkish",partOfSpeech:"adj.",definition:"characterized by sick sentimentality",example:"Although some nineteenth-century critics viewed Dickens's writing as mawkish, contemporary readers have found great emotional depth in his works."},{word:"maxim",partOfSpeech:"n.",definition:"a common saying expressing a principle of conduct",example:"Miss Manners's etiquette maxims are both entertaining and instructional."},{word:"mendacious",partOfSpeech:"adj.",definition:"having a lying, false character",example:"The mendacious content of the tabloid magazines is at least entertaining."},{word:"mercurial",partOfSpeech:"adj.",definition:"characterized by rapid change or temperamentality",example:"Though he was widely respected for his mathematical proofs, the mercurial genius was impossible to live with."},{word:"meritorious",partOfSpeech:"adj.",definition:"worthy of esteem or reward",example:"Manfred was given the congressional medal of honor for his meritorious actions."},{word:"metamorphosis",partOfSpeech:"n.",definition:"the change of form, shape, substance",example:"Winnifred went to the gym every day for a year and underwent a metamorphosis from a waiflike girl to an athletic woman."},{word:"meticulous",partOfSpeech:"adj.",definition:"extremely careful with details",example:"The ornate needlework in the bride's gown was a product of meticulous handiwork."},{word:"mitigate",partOfSpeech:"v.",definition:"to make less violent, alleviate",example:"When I had an awful sore throat, only warm tea would mitigate the pain. s of that place."},{word:"succinct",partOfSpeech:"adj.",definition:"marked by compact precision",example:"The governor's succinct speech energized the crowd while the mayor's rambled on and on."},{word:"superfluous",partOfSpeech:"adj.",definition:"exceeding what is necessary",example:"Tracy had already won the campaign so her constant flattery of others was superfluous."},{word:"surmise",partOfSpeech:"v.",definition:"to infer with little evidence",example:"After speaking to only one of the students, the teacher was able to surmise what had caused the fight."},{word:"surreptitious",partOfSpeech:"adj.",definition:"stealthy",example:"The surreptitious CIA agents were able to get in and out of the house without anyone noticing."},{word:"sycophant",partOfSpeech:"n.",definition:"one who flatters for self-gain",example:"Some see the people in the cabinet as the president's closest advisors, but others see them as sycophants."},{word:"tacit",partOfSpeech:"adj.",definition:"expressed without words",example:"I interpreted my parents' refusal to talk as a tacit acceptance of my request."},{word:"taciturn",partOfSpeech:"adj.",definition:"not inclined to talk",example:"Though Jane never seems to stop talking, her brother is quite taciturn."},{word:"tangential",partOfSpeech:"adj.",definition:"incidental, peripheral, divergent",example:"I tried to discuss my salary, but the boss kept veering off into tangential topics."},{word:"tantamount",partOfSpeech:"adj.",definition:"equivalent in value or significance",example:"When it comes to sports, fearing your opponent is tantamount to losing."},{word:"tedious",partOfSpeech:"adj.",definition:"dull, boring",example:"As time passed and the history professor continued to drone on and on, the lecture became increasingly tedious."},{word:"temerity",partOfSpeech:"n.",definition:"audacity, recklessness",example:"Tom and Huck entered the scary cave armed with nothing but their own temerity."},{word:"temperance",partOfSpeech:"n.",definition:"mode on:"fear, apprehension",example:"Feeling great trepidation, Anya refused to jump into the pool because she thought she saw a shark in it."},{word:"trite",partOfSpeech:"adj.",definition:"not original, overused",example:"Keith thought of himself as being very learned, but everyone else thought he was trite because his observations were always the same as David Letterman's."},{word:"truculent",partOfSpeech:"adj.",definition:"ready to fight, cruel",example:"This club doesn't really attract the dangerous types, so why was that bouncer being so truculent?"},{word:"truncate",partOfSpeech:"v.",definition:"to shorten by cutting off",example:"After winning the derby, the jockey truncated the long speech he had planned and thanked only his mom and his horse."},{word:"turgid",partOfSpeech:"adj.",definition:"swollen, excessively embellished in style or language",example:"The haughty writer did not realize how we all really felt about his turgid prose."},{word:"turpitude",partOfSpeech:"n.",definition:"depravity, moral corruption",example:"Sir Marcus's chivalry often contrasted with the turpitude he exhibited with the ladies at the tavern."},{word:"ubiquitous",partOfSpeech:"adj.",definition:"existing everywhere, widespread",example:"It seems that everyone in the United States has a television. The technology is ubiquitous here."},{word:"umbrage",partOfSpeech:"n.",definition:"resentment, offense",example:"He called me a lily-livered coward, and I took umbrage at the insult."},{word:"uncanny",partOfSpeech:"adj.",definition:"of supernatural character or origin",example:"Luka had an uncanny ability to know exactly what other people were thinking."},{word:"unctuous",partOfSpeech:"adj.",definition:"smooth or greasy in texture, appearance, manner",example:"The unctuous receptionist seemed untrustworthy, as if she was only being helpful because she thought we might give her a big tip."},{word:"upbraid",partOfSpeech:"v.",definition:"to criticize or scold severely",example:"The last thing Lindsay wanted was for Lisa to upbraid her again about missing the rent payment."},{word:"usurp",partOfSpeech:"v.",definition:"to seize by force, take possession of without right",example:"The rogue army general tried to usurp control of the government, but he failed because most of the army backed the legally elected president."},{word:"vacillate",partOfSpeech:"v.",definition:"to fluctuate, hesitate",example:"I prefer a definite answer, but my boss kept vacillating between the distinct options available to us."},{word:"vacuous",partOfSpeech:"adj.",definition:"lack of content or ideas, stupid",example:"Beyonce realized that the lyrics she had just penned were completely vacuous and tried to add more substance."},{word:"vapid",partOfSpeech:"adj.",definition:"lacking liveliness, dull",example:"The professor's comments about the poem were surprisingly vapid and dull."},{word:"vehemently",partOfSpeech:"adv.",definition:"marked by intense force or emotion",example:"The candidate vehemently opposed cutting back on Social Security funding."},{word:"venerable",partOfSpeech:"adj.",definition:"deserving of respect because of age or achievement",example:"The venerable Supreme Court justice had made several key rulings in landmark cases throughout the years."},{word:"venerate",partOfSpeech:"v.",definition:"to regard with respect or to honor",example:"The tribute to John Lennon sought to venerate his music, his words, and his legend."},{word:"veracity",partOfSpeech:"n.",definition:"truthfulness, accuracy",example:"With several agencies regulating the reports, it was difficult for Latifah to argue against its veracity."},{word:"verbose",partOfSpeech:"adj.",definition:"wordy, impaired by wordiness",example:"It took the verbose teacher two hours to explain the topic, while it should have taken only fifteen minutes."},{word:"vestige",partOfSpeech:"n.",definition:"a mark or trace of something lost or vanished",example:"Do you know if the Mexican tortilla is a vestige of some form of Aztec corn-based flat bread?"},{word:"vex",partOfSpeech:"v.",definition:"to confuse or annoy",example:"My little brother vexes me by poking me in the ribs for hours on end."},{word:"vigilant",partOfSpeech:"adj.",definition:"watchful, alert",example:"The guards remained vigilant throughout the night, but the enemy never launched the expected attack."},{word:"vilify",partOfSpeech:"v.",definition:"to lower in importance, defame",example:"After the Watergate scandal, almost any story written about President Nixon sought to vilify him."},{word:"vindictive",partOfSpeech:"adj.",definition:"vengeful",example:"The vindictive madman seeks to exact vengeance for any insult that he perceives is directed at him, no matter how small."},{word:"viscous",partOfSpeech:"adj.",definition:"not free flowing, syrupy",example:"The viscous syrup took three minutes to pour out of the bottle."},{word:"vitriolic",partOfSpeech:"adj.",definition:"having a caustic quality",example:"When angry, the woman would spew vitriolic insults."},{word:"vivacious",partOfSpeech:"adj.",definition:"lively, sprightly",example:"The vivacious clown makes all of the children laugh and giggle with his friendly antics."},{word:"vociferous",partOfSpeech:"adj.",definition:"loud, boisterous",example:"I'm tired of his vociferous whining so I'm breaking up with him."},{word:"wane",partOfSpeech:"v.",definition:"to decrease in size, dwindle",example:"Don't be so afraid of his wrath because his influence with the president is already beginning to wane."},{word:"wanton",partOfSpeech:"adj.",definition:"undisciplined, lewd, lustful",example:"Vicky's wanton demeanor often made the frat guys next door very excited."},{word:"whimsical",partOfSpeech:"adj.",definition:"fanciful, full of whims",example:"The whimsical little girl liked to pretend that she was an elvin princess."},{word:"wily",partOfSpeech:"adj.",definition:"crafty, sly",example:"Though they were not the strongest of the Thundercats, wily Kit and Kat were definitely the most clever."},{word:"winsome",partOfSpeech:"adj.",definition:"charming, pleasing",example:"After such a long, frustrating day, I was grateful for Chris's winsome attitude and childish naivete."},{word:"wistful",partOfSpeech:"adj.",definition:"full of yearning; musingly sad",example:"Since her pet rabbit died, Edda missed it terribly and sat around wistful all day long."},{word:"wizened",partOfSpeech:"adj.",definition:"dry, shrunken, wrinkled",example:"Agatha's grandmother, Stephanie, had the most wizened countenance, full of leathery wrinkles."},{word:"zealous",partOfSpeech:"adj.",definition:"fervent, filled with eagerness in pursuit of something",example:"If he were any more zealous about getting his promotion, he'd practically live at the office."},{word:"zenith",partOfSpeech:"n.",definition:"the highest point, culminating point",example:"I was too nice to tell Nelly that she had reached the absolute zenith of her career with that one hit of hers."},{word:"zephyr",partOfSpeech:"n.",definition:"a gentle breeze",example:"If not for the zephyrs that were blowing and cooling us, our room would've been unbearably hot."}];

const SCHEDULE = {
  right: [100, 500, 1000],
  wrong: [50, 10, 5]
};

let queue = [];
let seen = new Set();
let current = null;
let revealed = false;

function initQueue() {
  const saved = localStorage.getItem('fc_state');
  if (saved) {
    try {
      const s = JSON.parse(saved);
      queue = s.queue || [];
      seen = new Set(s.seen || []);
    } catch(e) {}
  }
  if (queue.length === 0) {
    queue = words.map((w,i) => ({ idx: i, due: 0, streak: 0, direction: 1 }));
    shuffle(queue);
  }
  showNext();
}

function saveState() {
  localStorage.setItem('fc_state', JSON.stringify({ queue, seen: [...seen] }));
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

function getDue() {
  const now = Date.now();
  return queue.filter(c => c.due <= now);
}

function showNext() {
  revealed = false;
  document.getElementById('back').style.display = 'none';
  document.getElementById('hint').style.display = 'block';
  document.getElementById('buttons').style.visibility = 'hidden';

  const due = getDue();
  if (due.length === 0) {
    const next = Math.min(...queue.map(c => c.due));
    const mins = Math.ceil((next - Date.now()) / 60000);
    document.getElementById('word').textContent = '—';
    document.getElementById('pos').textContent = '';
    document.getElementById('progress').textContent = 'all caught up';
    document.getElementById('next-info').textContent = `next card in ${mins}m`;
    document.getElementById('queue-info').textContent = '';
    current = null;
    return;
  }

  current = due[Math.floor(Math.random() * due.length)];
  const w = words[current.idx];
  document.getElementById('word').textContent = w.word;
  document.getElementById('pos').textContent = w.partOfSpeech;
  document.getElementById('definition').textContent = w.definition;
  document.getElementById('example').textContent = '"' + w.example + '"';
  document.getElementById('next-info').textContent = '';
  document.getElementById('progress').textContent = `${seen.size} / ${words.length} seen`;
  document.getElementById('queue-info').textContent = `${due.length} due`;
  seen.add(current.idx);
}

function revealCard() {
  if (!current || revealed) return;
  revealed = true;
  document.getElementById('back').style.display = 'block';
  document.getElementById('hint').style.display = 'none';
  document.getElementById('buttons').style.visibility = 'visible';
}

function answer(correct) {
  if (!current || !revealed) return;
  const streak = current.streak;
  let delay;
  if (correct) {
    const s = Math.min(streak >= 0 ? streak : 0, 2);
    delay = SCHEDULE.right[s] * 60 * 1000;
    current.streak = streak >= 0 ? streak + 1 : 1;
  } else {
    const s = Math.min(streak < 0 ? Math.abs(streak) - 1 : 0, 2);
    delay = SCHEDULE.wrong[s] * 60 * 1000;
    current.streak = streak < 0 ? streak - 1 : -1;
  }
  current.due = Date.now() + delay;
  const label = correct
    ? `✓ next in ${delay >= 60*60*1000 ? (delay/3600000).toFixed(0)+'h' : (delay/60000).toFixed(0)+'m'}`
    : `✗ back in ${(delay/60000).toFixed(0)}m`;
  showToast(label);
  saveState();
  setTimeout(showNext, 300);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

initQueue();
</script>
